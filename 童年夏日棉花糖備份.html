<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>童年夏日棉花糖</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;500;600&display=swap">
<style>
  /* 版面：左側 3D 畫布、右側浮動資訊面板。一般元件為 Soft UI（微暖白、大圓角、極淡陰影）；
     只有主要行動按鈕與目前步驟使用黏土風（Neo-Claymorphism）糖果漸層，成為視線焦點 */
  :root {
    --page: #F1EFF6;
    --surface: #F9F9FB;
    --card: #FFFFFF;
    --ink: #2B2541;
    --muted: #7B7590;
    --line: rgba(43, 37, 65, .08);
    --pink: #FF7AA8;
    --pink-ink: #C93A6E;
    --peach: #FFB38A;
    --lilac: #B794F6;
    --mint: #6FD9BC;
    --sky: #8EC5FF;
    --lemon: #FFE07A;
    --flame: #F2547D; /* 3D 畫布上的拖曳目標與畫圈導引 */
    --clay: linear-gradient(135deg, #FFB38A 0%, #FF7AA8 52%, #B794F6 100%);
    --candy-soft: linear-gradient(135deg, #FFE1EA 0%, #EDE2FF 100%);
    --shadow-soft: 0 4px 20px rgba(0, 0, 0, .03);
    --shadow-chip: 0 2px 8px rgba(43, 37, 65, .05), inset 0 0 0 1px var(--line);
    --shadow-lift: 0 10px 24px rgba(183, 148, 246, .20), inset 0 0 0 1px rgba(183, 148, 246, .25);
    --shadow-press: inset 0 3px 8px rgba(122, 52, 140, .16), inset 0 0 0 1.5px rgba(255, 122, 168, .45);
    --shadow-clay: 0 10px 22px rgba(255, 122, 168, .34), 0 3px 6px rgba(183, 148, 246, .25),
                   inset 0 -5px 10px rgba(122, 52, 140, .22), inset 0 5px 10px rgba(255, 255, 255, .55);
    --shadow-clay-press: 0 4px 10px rgba(255, 122, 168, .28),
                         inset 0 4px 10px rgba(122, 52, 140, .30), inset 0 -2px 6px rgba(255, 255, 255, .35);
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
    --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --font: 'Fredoka', 'Chiron GoRound TC', -apple-system, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    color-scheme: light;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    background: var(--page); color: var(--ink);
    font: 16px/1.65 var(--font);
  }
  .app {
    height: 100%; box-sizing: border-box;
    display: grid; gap: 16px;
    grid-template-columns: minmax(0, 1fr) clamp(340px, 36vw, 450px);
    padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  @media (max-aspect-ratio: 1/1) {
    .app { grid-template-columns: 1fr; grid-template-rows: minmax(0, 48%) minmax(0, 1fr); gap: 12px; padding-block: 12px; }
  }

  /* ===== 3D 畫布區 ===== */
  .stage {
    position: relative; min-width: 0; min-height: 0; overflow: hidden;
    border-radius: 20px;
    background: radial-gradient(110% 90% at 50% 22%, #FFFFFF 0%, #F7F1FB 52%, #ECEAF7 100%);
    box-shadow: var(--shadow-soft), inset 0 0 0 1px rgba(255, 255, 255, .8);
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #gl { position: absolute; inset: 0; }
  #gl canvas { display: block; }
  #trail, #guide { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .g-ring { fill: none; stroke: var(--flame); stroke-width: 3; stroke-dasharray: 6 6; }
  .g-ring.near { stroke-width: 5; stroke-dasharray: none; fill: rgba(242, 84, 125, .12); }
  .g-spin { fill: none; stroke: var(--flame); stroke-width: 2.5; stroke-dasharray: 8 7; opacity: .85; }
  .g-bowl { fill: none; stroke: var(--flame); stroke-width: 2.5; stroke-dasharray: 8 7; opacity: .7; }
  .g-bowl.near { stroke-width: 4; stroke-dasharray: none; fill: rgba(242, 84, 125, .08); opacity: 1; }

  /* 毛玻璃浮動貼紙（操作提示、轉速、提示訊息、可拖曳工具） */
  .glass {
    background: rgba(255, 255, 255, .55);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, .8);
    box-shadow: 0 4px 14px rgba(43, 37, 65, .06);
  }
  .viewhint {
    position: absolute; top: 14px; right: 14px;
    display: flex; align-items: center; gap: 6px;
    font-size: 12.5px; color: var(--ink); letter-spacing: .04em;
    padding: 5px 12px 5px 10px; border-radius: 999px; pointer-events: none;
  }
  .viewreset {
    position: absolute; right: 18px; bottom: 18px; z-index: 3;
    display: inline-flex; align-items: center; gap: 6px;
    font: inherit; font-size: 13.5px; color: var(--ink); cursor: pointer;
    padding: 8px 14px; border-radius: 999px;
    transition: all .3s var(--ease), transform .35s var(--spring);
  }
  .viewreset .icon { width: 16px; height: 16px; color: var(--pink); stroke-width: 2.3; }
  .viewreset:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(183, 148, 246, .22); }
  .viewreset:active { transform: scale(.95); }
  .viewhint::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--clay); box-shadow: 0 0 0 3px rgba(255, 122, 168, .15); }

  .tool {
    position: absolute; left: 18px; bottom: 18px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 12px 16px 8px; border-radius: 20px;
    border: 1.5px dashed rgba(242, 84, 125, .55);
    font: inherit; font-size: 13px; font-weight: 500; color: var(--pink-ink);
    cursor: grab; touch-action: none; z-index: 3;
    transition: box-shadow .3s var(--ease), border-color .3s var(--ease), background-color .3s var(--ease); /* 不過渡 transform，拖曳才會跟手 */
  }
  .tool span { padding: 1px 10px; border-radius: 999px; background: var(--clay); color: #fff; font-size: 12px; }
  .tool:hover { box-shadow: 0 10px 24px rgba(255, 122, 168, .22); }
  .tool.dragging { cursor: grabbing; border-style: solid; border-color: var(--pink); box-shadow: 0 14px 30px rgba(255, 122, 168, .3); }
  .tool:focus-visible { outline: 3px solid var(--lilac); outline-offset: 3px; }
  #stick svg { width: 22px; height: 84px; }
  #spoon svg { width: 84px; height: 42px; }

  .speed {
    position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
    width: min(340px, calc(100% - 40px)); box-sizing: border-box;
    border-radius: 999px; padding: 10px 18px;
    display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--ink);
  }
  .speed-bar { position: relative; flex: 1; height: 12px; background: rgba(43, 37, 65, .08); border-radius: 999px; overflow: hidden; box-shadow: inset 0 1px 3px rgba(43, 37, 65, .1); }
  #speedFill { height: 100%; width: 0; background: linear-gradient(90deg, var(--lemon), var(--peach)); border-radius: 999px; transition: background .3s var(--ease); }
  #speedFill.ok { background: linear-gradient(90deg, var(--mint), var(--sky)); }
  .speed-mark { position: absolute; left: 60%; top: -2px; bottom: -2px; width: 2px; background: var(--ink); opacity: .5; }

  .ghost { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 2; }
  .ghost.tool-ghost { opacity: .55; }
  .ghost.finger { width: 30px; height: 30px; border-radius: 50%; background: rgba(255, 122, 168, .4); border: 2px solid #fff; box-shadow: 0 0 0 2px rgba(255, 122, 168, .6), 0 6px 14px rgba(255, 122, 168, .35); }
  .ghost svg { display: block; }

  .toast {
    position: absolute; top: 14px; left: 50%; transform: translate(-50%, -8px);
    background: rgba(43, 37, 65, .82); color: #fff;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    padding: 8px 18px; border-radius: 999px;
    font-size: 15px; max-width: calc(100% - 40px); text-align: center;
    opacity: 0; transition: all .3s var(--ease); pointer-events: none; z-index: 4;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ===== 右側資訊面板（Soft UI 大圓角容器） ===== */
  .panel {
    display: flex; flex-direction: column; min-height: 0; min-width: 0;
    background: var(--surface); border-radius: 20px;
    box-shadow: var(--shadow-soft), inset 0 0 0 1px rgba(255, 255, 255, .9);
    overflow: hidden;
  }
  .p-head, .p-body, .p-foot { padding-left: 20px; padding-right: 20px; }
  .p-head { padding-block: 18px 6px; display: flex; flex-direction: column; gap: 10px; }
  /* 上一步：面板左上角的 Soft UI 小膠囊 */
  .backbtn {
    align-self: flex-start; display: inline-flex; align-items: center; gap: 6px;
    font: inherit; font-size: 14px; color: var(--ink); cursor: pointer;
    padding: 6px 14px 6px 10px; border: 0; border-radius: 999px;
    background: var(--card); box-shadow: var(--shadow-chip);
    transition: all .3s var(--ease), transform .35s var(--spring);
  }
  .backbtn .icon { width: 16px; height: 16px; color: var(--pink); stroke-width: 2.3; }
  .backbtn:hover { transform: translateY(-1px); box-shadow: var(--shadow-lift); }
  .backbtn:active { transform: scale(.95); box-shadow: var(--shadow-press); }

  /* 步驟導覽：膠囊狀浮動卡片 */
  .nav {
    display: flex; flex-wrap: wrap; gap: 4px; padding: 5px;
    background: var(--card); border-radius: 999px; box-shadow: var(--shadow-soft), inset 0 0 0 1px var(--line);
  }
  .nav button {
    flex: 1 1 auto; white-space: nowrap;
    font: inherit; font-size: 13.5px; line-height: 1.2; padding: 8px 12px;
    border: 0; border-radius: 999px; background: transparent; color: var(--muted); cursor: pointer;
    transition: all .3s var(--ease), transform .35s var(--spring);
  }
  .nav button.done { color: var(--ink); background: #F4F1F9; }
  .nav button.done:hover { background: #EDE6F8; transform: translateY(-1px); }
  .nav button:active:not(:disabled) { transform: scale(.94); }
  .nav button.cur { background: var(--clay); color: #fff; font-weight: 500; box-shadow: none; } /* 進行中：同色漸層但平面，黏土材質只留給可點擊的 CTA */
  .nav button:disabled { cursor: default; }
  .nav button:disabled:not(.cur) { opacity: .45; }
  #jump { font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 999px; border: 0; background: var(--card); box-shadow: var(--shadow-chip); color: var(--ink); width: max-content; }

  .p-body { flex: 1; min-height: 0; overflow-y: auto; padding-block: 16px 20px; display: flex; flex-direction: column; gap: 14px; }
  .p-body > * { margin: 0; flex-shrink: 0; }
  h2 { font-weight: 600; font-size: 27px; line-height: 1.3; margin: 0; text-wrap: balance; letter-spacing: .02em; }
  h3 { font-size: 19px; font-weight: 500; margin: 0; }
  .lead { font-size: 18px; margin: 0; }
  .note { font-size: 15px; color: var(--muted); margin: 0; }
  .qt { font-size: 18px; font-weight: 500; margin: 0; }
  .k { font-size: 13px; color: var(--muted); letter-spacing: .1em; margin: 0; }
  .live { font-size: 17px; font-weight: 500; color: var(--pink-ink); margin: 0; min-height: 1.6em; }

  /* 課文摘句：糖果粉彩卡片 */
  .quote {
    margin: 0; padding: 14px 18px; position: relative;
    background: none; border-radius: 20px;
    font-size: 18px; line-height: 1.85;
    display: flex; flex-direction: column; gap: 6px;
  }
  .quote p { margin: 0; }
  .quote::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 2px; pointer-events: none;
    background: linear-gradient(135deg, #FFB38A, #FF7AA8 50%, #B794F6);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
  }
  .quote .tag {
    align-self: flex-start;
    font-size: 12px; font-weight: 500; letter-spacing: .06em;
    color: var(--pink-ink); background: rgba(255, 255, 255, .75); border-radius: 999px; padding: 1px 10px;
  }

  /* 按鈕：次要為 Soft UI；主要行動為黏土風 */
  .btn {
    font: inherit; font-size: 17px; min-height: 46px; padding: 8px 22px;
    border: 0; border-radius: 999px; background: var(--card); color: var(--ink); cursor: pointer;
    box-shadow: var(--shadow-chip); align-self: flex-start;
    transition: all .3s var(--ease), transform .35s var(--spring);
  }
  .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
  .btn:active:not(:disabled) { transform: translateY(1px) scale(.98); box-shadow: var(--shadow-press); }
  .btn.primary {
    background: var(--clay); color: #fff; font-weight: 600; letter-spacing: .04em;
    text-shadow: 0 1px 2px rgba(122, 52, 140, .3); box-shadow: var(--shadow-clay);
    padding-inline: 26px; min-height: 50px;
  }
  .btn.primary:hover:not(:disabled) { transform: translateY(-2px); filter: saturate(1.08) brightness(1.03); box-shadow: 0 14px 28px rgba(255, 122, 168, .4), 0 4px 8px rgba(183, 148, 246, .3), inset 0 -5px 10px rgba(122, 52, 140, .22), inset 0 5px 10px rgba(255, 255, 255, .55); }
  .btn.primary:active:not(:disabled) { transform: translateY(1px) scale(.97); box-shadow: var(--shadow-clay-press); }
  /* 主要 CTA：置中、填滿容器，左右各內縮 120px（面板太窄時自動收小內縮，按鈕至少 180px） */
  .p-body > .btn.primary, .p-body > .hold { align-self: stretch; margin-inline: clamp(0px, calc(50% - 160px), 120px); }
  .btn.small { font-size: 15px; min-height: 38px; padding: 4px 16px; }
  .btn:disabled { opacity: .45; cursor: default; filter: grayscale(.35); box-shadow: none; }
  .btn.ghostbtn { font-size: 14px; min-height: 34px; padding: 4px 14px; color: var(--muted); }
  button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid var(--lilac); outline-offset: 2px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  /* Lucide 圖示：尺寸跟著文字走，線寬對應字重 400 的筆畫（約 1.4px） */
  .icon { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.125em; }

  /* 選項小卡：平時微凸，選取轉為糖果漸層並微凹陷 */
  .opts { display: grid; gap: 10px; }
  .opt, .chip, .pcell, .acard {
    font: inherit; color: var(--ink); cursor: pointer;
    border: 0; background: var(--card); box-shadow: var(--shadow-chip);
    transition: all .3s var(--ease), transform .35s var(--spring);
  }
  .opt:hover, .chip:hover, .pcell:hover, .acard:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
  .opt:active, .chip:active, .pcell:active, .acard:active { transform: translateY(1px) scale(.98); box-shadow: var(--shadow-press); }
  .opt.on, .chip.on, .pcell.cur, .acard.on { background: var(--candy-soft); box-shadow: var(--shadow-press); font-weight: 500; transform: none; }
  .opt { font-size: 17px; text-align: left; padding: 11px 16px; min-height: 48px; border-radius: 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { font-size: 16px; padding: 6px 16px; min-height: 40px; border-radius: 999px; }

  /* 砂糖顏色選擇與已倒入的層次 */
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
  .swatch i { display: inline-block; width: 16px; height: 16px; margin-right: 6px; vertical-align: -3px; border-radius: 50%; background: var(--c); box-shadow: inset 0 -2px 3px rgba(0, 0, 0, .12), inset 0 2px 3px rgba(255, 255, 255, .6); }
  .layers { display: flex; flex-direction: column; gap: 6px; }
  .layer-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; color: var(--muted); }
  .layer { padding: 2px 12px; border-radius: 999px; font-size: 14px; color: var(--ink); background: color-mix(in srgb, var(--c) 30%, white); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 50%, white); }
  .parts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pcell { font-size: 16px; display: flex; align-items: center; gap: 10px; padding: 10px 14px; min-height: 52px; border-radius: 16px; text-align: left; }
  .pcell .ck {
    width: 24px; height: 24px; flex: none; border-radius: 50%;
    display: grid; place-items: center; font-size: 13px; color: #fff;
    background: #F1EEF6; box-shadow: inset 0 1px 3px rgba(43, 37, 65, .12);
    transition: all .3s var(--ease);
  }
  .pcell.seen .ck, .pcell.done .ck { background: var(--clay); box-shadow: 0 3px 8px rgba(255, 122, 168, .35); }

  .card { border-radius: 20px; padding: 16px 18px; background: var(--card); box-shadow: var(--shadow-soft), inset 0 0 0 1px var(--line); display: flex; flex-direction: column; gap: 10px; }
  .card p { margin: 0; }
  .done-box { background: linear-gradient(135deg, #E2FAF2 0%, #E6F0FF 100%); border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
  .done-box p { margin: 0; }

  .meter { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
  .meter-bar { flex: 1; height: 14px; background: #ECE8F3; border-radius: 999px; overflow: hidden; box-shadow: inset 0 1px 3px rgba(43, 37, 65, .1); }
  .meter-fill { height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--lemon), var(--peach), var(--pink)); }
  .meter-fill.size { background: linear-gradient(90deg, var(--mint), var(--sky), var(--lilac)); }
  .hold {
    font: inherit; font-size: 17px; font-weight: 600; letter-spacing: .04em; min-height: 50px; padding: 8px 26px;
    border: 0; border-radius: 999px; background: var(--clay); color: #fff; cursor: pointer;
    box-shadow: var(--shadow-clay); text-shadow: 0 1px 2px rgba(122, 52, 140, .3);
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    transition: all .3s var(--ease), transform .2s var(--spring);
  }
  .hold:hover { filter: brightness(1.03); }
  .hold.on { transform: scale(.97); box-shadow: var(--shadow-clay-press); }

  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .compare div { background: var(--card); box-shadow: var(--shadow-chip); border-radius: 16px; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .compare b { font-size: 17px; font-weight: 500; }

  .demo-flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 16px; }
  .demo-flow span { background: #F6F3FA; border-radius: 999px; padding: 3px 12px; }
  .demo-flow .arr { background: none; padding: 0; color: var(--pink); font-weight: 700; }
  .assoc { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
  .acard { font-size: 15px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px 8px; border-radius: 20px; }
  .acard svg { width: 60px; height: 60px; }
  .frame { font-size: 21px; line-height: 2; margin: 0; }
  .blank { padding: 0 8px; font-weight: 500; background: linear-gradient(transparent 62%, #FFD3E2 62%); }
  textarea, .input {
    width: 100%; box-sizing: border-box; font: inherit; font-size: 18px; padding: 12px 14px;
    border: 0; border-radius: 16px; background: var(--card); color: var(--ink);
    box-shadow: inset 0 2px 6px rgba(43, 37, 65, .07), inset 0 0 0 1px var(--line);
    transition: box-shadow .3s var(--ease);
  }
  textarea:focus, .input:focus { outline: none; box-shadow: inset 0 2px 6px rgba(43, 37, 65, .07), 0 0 0 3px rgba(183, 148, 246, .45); }
  textarea { min-height: 88px; resize: vertical; }
  textarea.big { font-size: 20px; min-height: 120px; }
  .ask { background: #FFF6DA; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .ask p { margin: 0; font-weight: 500; }
  .result {
    border: 2px solid transparent; border-radius: 20px; padding: 18px 20px;
    background: linear-gradient(var(--card), var(--card)) padding-box, var(--clay) border-box;
    box-shadow: 0 10px 26px rgba(255, 122, 168, .14);
    display: flex; flex-direction: column; gap: 12px;
  }
  .result .sent { font-size: 24px; line-height: 1.8; margin: 0; }
  .result mark { background: linear-gradient(transparent 58%, #FFE89A 58%); color: inherit; }
  .result mark.like { background: linear-gradient(transparent 58%, #FFC9DB 58%); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; font-size: 14px; }
  .tags span { border-radius: 999px; padding: 3px 12px; }
  .tags .t1 { background: #FFE1EA; color: var(--pink-ink); }
  .tags .t2 { background: #FFF3C4; color: #8A6400; }

  /* 底部：觀察詞標籤與重來按鈕 */
  .p-foot { padding-block: 8px 16px; display: flex; flex-direction: column; gap: 10px; }
  /* 觀察詞：平時收成膠囊，點開才展開成完整卡片 */
  .bag-pill {

  }
  .bag-pill:hover { transform: translateY(-1px); box-shadow: var(--shadow-lift); }

  .bag-pill-label { flex: 1; }
  .bag-dots { display: flex; gap: 8px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .chev { width: 18px; height: 18px; color: var(--muted); transition: transform .3s var(--ease); }
  .bag-pill[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .pcell .ck .icon { width: 14px; height: 14px; stroke-width: 3; }
  .chip .icon { margin-right: 4px; color: var(--pink); }
  .demo-flow .arr { display: inline-flex; }
  .demo-flow .arr .icon { stroke-width: 2.4; }
  .bag-pill.bump { animation: bump .6s var(--spring); }
  @keyframes bump { 40% { transform: scale(1.04); box-shadow: 0 0 0 4px rgba(255, 122, 168, .25), var(--shadow-soft); } }
  .bag-card {
    display: flex; flex-direction: column; gap: 10px;
    max-height: 38vh; overflow-y: auto; box-sizing: border-box;
    padding: 14px 16px; border-radius: 20px;

    animation: cardIn .3s var(--ease);
  }

  .bag-wrap { display: flex; flex-direction: column; gap: 6px; }

  /* 捲軸：暖白底、毛玻璃質感的膠囊滑塊 */
  ::-webkit-scrollbar { width: 12px; height: 12px; }
  ::-webkit-scrollbar-track { background: var(--surface); }
  ::-webkit-scrollbar-thumb {
    border: 3px solid transparent; border-radius: 999px; background-clip: padding-box;
    background-color: rgba(255, 255, 255, .55);
    background-image: linear-gradient(180deg, rgba(255, 255, 255, .9), rgba(236, 232, 245, .75));
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .85), inset 0 0 0 2px rgba(43, 37, 65, .08), inset 0 -2px 4px rgba(43, 37, 65, .06);
  }
  ::-webkit-scrollbar-thumb:hover { background-image: linear-gradient(180deg, #FFFFFF, rgba(226, 220, 240, .85)); }
  ::-webkit-scrollbar-corner { background: var(--surface); }
  @supports not selector(::-webkit-scrollbar) { * { scrollbar-color: #E4DFEE var(--surface); scrollbar-width: thin; } }
  .bag .w { font-size: 13px; padding: 2px 12px; border-radius: 999px; }
  /* 觀察詞依分類上色：形狀／質地／變化 */
  .bag .w.shape { background: #FFE1EA; color: #B23A66; }
  .bag .w.texture { background: #DDF6EE; color: #22795F; }
  .bag .w.change { background: #ECE3FF; color: #6A45B8; }
  .bag-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .legend { display: flex; gap: 10px; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .legend span::before { content: ""; width: 9px; height: 9px; border-radius: 50%; }
  .legend .shape::before { background: #FF7AA8; }
  .legend .texture::before { background: #4FC9A6; }
  .legend .change::before { background: #A47EF0; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before { transition: none !important; animation: none !important; }
  }
  /* ===== 描寫標籤：沿用課本「語文讀寫」四色，另加感覺（點線）與比喻（波浪線） ===== */
  :root { --t-num: #9B7BE0; --t-color: #F06E9C; --t-shape: #4F94E8; --t-size: #B6F090; --t-sense: #F29A3E; --t-meta: #B86FE0; }
  .tc-num, .u-num { --tc: var(--t-num); }

  .tc-shape, .u-shape { --tc: var(--t-shape); }
  .tc-size, .u-size { --tc: var(--t-size); }
  .tc-sense, .u-sense { --tc: var(--t-sense); }
  .tc-meta, .u-meta { --tc: var(--t-meta); }
  .u {
    --hl: color-mix(in srgb, var(--tc) 50%, transparent);
    background: linear-gradient(transparent 52%, var(--hl) 52%, var(--hl) 92%, transparent 92%);

  /* 比喻：不用底色，改以紫色文字標示 */
  .u.u-meta, .u.u-meta:hover, .u.u-meta.show { --hl: transparent; color: #9A4FD0; font-weight: 500; }
  .u:focus-visible { outline: 2px solid var(--tc); outline-offset: 2px; }

  .quote[data-filter] .u.u-meta { --hl: transparent; }

  .vlabel { display: inline-block; font-size: 12px; padding: 1px 10px; border-radius: 999px; background: #EEE9F5; color: var(--muted); margin-right: 8px; }

  /* 想像地圖：核心比喻在上，延伸以直線串起 */

  .seen { font-size: 13px; color: var(--muted); margin: 0; }
  .ibranches { list-style: none; margin: 0 0 0 22px; padding: 12px 0 0; border-left: 2px solid #E4DEEE; display: flex; flex-direction: column; gap: 10px; }

  .idetail { display: flex; flex-direction: column; gap: 8px; padding-left: 4px; }

  .app.wide-panel { grid-template-columns: minmax(0, 1fr) clamp(340px, 55vw, 760px); }
  @media (max-aspect-ratio: 1/1) { .app.wide-panel { grid-template-columns: 1fr; } }

  /* 延伸想像 */
  .ext { background: var(--card); border-radius: 16px; padding: 12px 14px; box-shadow: var(--shadow-chip); display: flex; flex-direction: column; gap: 6px; }
  .ext .line { font-size: 17px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px; }

    flex: 1 1 auto; width: 100%; min-width: 0; font: inherit; font-size: 17px; color: var(--ink);

  .parts.checks { grid-template-columns: 1fr; gap: 8px; }

  .check input { width: 20px; height: 20px; accent-color: var(--pink); flex: none; }
  .favpair { font-size: 17px; margin: 0; background: var(--candy-soft); border-radius: 16px; padding: 10px 14px; }

  /* 底部：觀察詞與作者的想像兩顆膠囊 */
  .pill-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill-row .bag-pill { width: auto; flex: 1 1 230px; }
  .pill-row #imagToggle { flex: 1 1 150px; }
  .imag-count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .caption { font-size: 13px; color: var(--muted); margin: 0; }
  .p-body > .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-inline: clamp(0px, calc(50% - 160px), 120px); }
  .duo .btn { width: 100%; padding-inline: 10px; }

  /* 拍立得：從印表機出紙、相片慢慢顯影 */
  .polo {
    position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px;
    background: rgba(43, 37, 65, .38); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    animation: fadeIn .3s var(--ease);
  }
  .polo[hidden] { display: none; }
  .polo-stage { --w: min(330px, 78vw, calc((100dvh - 260px) * .62)); width: calc(var(--w) + 40px); display: flex; gap: 0; flex-direction: column; align-items: center; position: relative; }
  .printer {
    position: relative; z-index: 2; width: 100%; height: 58px; border-radius: 22px 22px 16px 16px;
    background: linear-gradient(180deg, #FFD3E2, #F6B4CC); box-shadow: 0 10px 24px rgba(255, 122, 168, .3), inset 0 2px 0 rgba(255, 255, 255, .7), inset 0 -4px 8px rgba(214, 90, 140, .18);
  }
  .printer::before { content: ""; position: absolute; left: 22px; top: 16px; width: 14px; height: 14px; border-radius: 50%; background: #FFF6DA; box-shadow: 0 0 0 4px rgba(255, 255, 255, .5); }
  .printer::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: 8px; height: 8px; border-radius: 999px; background: #8E5A72; box-shadow: inset 0 2px 3px rgba(0, 0, 0, .35); }
  .polo-clip { width: var(--w); margin-top: -12px; padding: 0 20px 28px; overflow: hidden; box-sizing: content-box; }
  .polo-card {

    margin: 0; background: #FFFDF9; padding: 14px 14px 18px; border-radius: 6px;
    box-shadow: 0 14px 30px rgba(43, 37, 65, .22), 0 2px 4px rgba(43, 37, 65, .08);
    transform-origin: 50% 0; animation: polo-print 2.4s cubic-bezier(.45, .05, .3, 1) both, polo-settle .8s var(--spring) 2.4s both;
  }
  @keyframes polo-print { 0% { transform: translateY(-102%); } 15% { transform: translateY(-80%); } 30% { transform: translateY(-62%); } 100% { transform: translateY(0); } }
  @keyframes polo-settle { from { transform: none; } to { transform: rotate(-2deg) translateY(6px); } }
  .polo-photo { position: relative; aspect-ratio: 1; border-radius: 2px; overflow: hidden; background: #2B2541; }
  .polo-photo img { width: 100%; height: 100%; object-fit: cover; display: block; animation: polo-dev 3.6s ease-out .6s both; }
  @keyframes polo-dev { from { filter: brightness(.35) saturate(0) contrast(.7) blur(2px); opacity: .6; } to { filter: none; opacity: 1; } }
  .polo-card figcaption { padding: 12px 4px 0; display: flex; flex-direction: column; gap: 6px; }
  .polo-text { margin: 0; font-size: 15.5px; line-height: 1.75; color: #3A3150; }

  .polo-close { position: absolute; top: -6px; right: -6px; z-index: 3; }
  .polo-card.pressing { transition: transform .6s var(--ease), box-shadow .6s var(--ease); transform: rotate(-2deg) translateY(6px) scale(.97) !important; box-shadow: 0 0 0 4px rgba(255, 122, 168, .45), 0 10px 22px rgba(43, 37, 65, .2); }

  .panel { position: relative; }

  /* ===== 整合版：全螢幕 3D、浮動步驟小卡、角落 HUD ===== */

  .panel {

    right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px));

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   工具函式
   ============================================================ */
const $ = s => document.querySelector(s);
const V3 = THREE.Vector3;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const ease = t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let seed = 11;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const noise3 = (x, y, z) => Math.sin(x * 3.1 + y * 1.7) * Math.cos(z * 2.9 - x * 1.3) * 0.6 + Math.sin(y * 5.3 + z * 4.1 + x * 0.7) * 0.4;
const TAU = Math.PI * 2;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const stageEl = $('#stage'), glEl = $('#gl'), pbody = $('#pbody'), bagEl = $('#bag'), navEl = $('#nav');
const toastEl = $('#toast'), trailCv = $('#trail'), speedEl = $('#speed'), speedFill = $('#speedFill');
const spoonTool = $('#spoon'), ghostEl = $('#ghost'), restartBtn = $('#restart'), viewHint = $('#viewhint');
const gRing = $('#gRing'), gSpin = $('#gSpin'), gBowl = $('#gBowl');
const orbsEl = $('#orbs'), bubbleEl = $('#bubble'), dialEl = $('#dial'), fwordsEl = $('#fwords'), panelEl = $('.panel');

/* ============================================================
   渲染器：抗鋸齒、透明背景、sRGB 色彩管理
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping; // 柔和色調映射，保留粉彩飽和度
// 畫質分級：平板等觸控裝置一開始就用輕量設定；執行中若幀率過低，再自動降級
const IS_TABLET = navigator.maxTouchPoints > 1 && window.matchMedia('(pointer: coarse)').matches;
let QUALITY = IS_TABLET ? 'low' : 'high';
let MAX_DPR = QUALITY === 'high' ? 2 : 1.25;
let composer = null, useAO = false; // 環境光遮蔽後製（只在完整版開啟）
renderer.setPixelRatio(Math.min(window.devicePixelRatio, MAX_DPR));
glEl.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// 粉彩漸層背景：果凍透光材質需要背景才看得出通透感
{
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const g = c.getContext('2d'), grad = g.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, '#F6EEFF'); grad.addColorStop(0.55, '#FBEFF4'); grad.addColorStop(1, '#FFF1E6');
  g.fillStyle = grad; g.fillRect(0, 0, 4, 256);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  scene.background = tex;
}
// 粉彩環境貼圖：用彩色光板生成，反光帶粉橘、淡藍、鵝黃、淡紫色調
{
  const env = new THREE.Scene();
  env.background = new THREE.Color('#EDE6F5');
  const board = (color, pos, size) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(size, size), new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide }));
    m.position.copy(pos); m.lookAt(0, 0, 0); env.add(m);
  };
  board('#FFC9B0', new THREE.Vector3(-6, 3, 2), 6);
  board('#B8DCFF', new THREE.Vector3(6, 3, 2), 6);
  board('#FFF4C9', new THREE.Vector3(0, 7, 0), 7);
  board('#E4D2FF', new THREE.Vector3(0, 2, -7), 6);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(env, 0.04).texture;
  pmrem.dispose();
}
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
camera.position.set(5.6, 6.6, 7.8);

// 鏡頭控制：360 度旋轉與縮放（操作手勢時會鎖定）
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.minDistance = 2.5;
controls.maxDistance = 18;
controls.maxPolarAngle = Math.PI * 0.49;
controls.target.set(0, 1.4, 0);

// 粉彩燈光（材質測試台定案）：天空光、左暖粉橘、右淡藍、後方淡紫輪廓，棉花糖兩側粉紅與鵝黃點光
const ENV_INTENSITY = 1.3;
scene.add(new THREE.HemisphereLight(0xf3e8ff, 0xffe6d6, 1.75));
const warm = new THREE.DirectionalLight(0xffc2a6, 2.4);
warm.position.set(-5, 6, 3);
const cool = new THREE.DirectionalLight(0xa9d2ff, 1.25);
cool.position.set(5, 5, 2);
const rim = new THREE.DirectionalLight(0xd6c2ff, 0.6);
rim.position.set(0, 4, -5);
const pinkLight = new THREE.PointLight(0xff9ec4, 6, 0, 1.4);
pinkLight.position.set(-2.1, 4.4, 1.6);
const lemonLight = new THREE.PointLight(0xfff0a8, 5, 0, 1.4);
lemonLight.position.set(2.1, 4.1, 1.4);
scene.add(warm, cool, rim, pinkLight, lemonLight);

/* ============================================================
   棉花糖機模型
   ============================================================ */
// 機台材質：果凍霧面（MeshPhysicalMaterial，參數取自材質測試台）
// 輕量版：關閉透光（每幀省下一次整個場景的繪製）與外層光澤，改為不透明，霧面果凍的顏色與粗糙度不變
const JELLY = { roughness: 0.72, opacity: 0.9, transmission: 0.2, ior: 1.48, clearcoat: 0.16, clearcoatRoughness: 0.6, thickness: 2 };
if (QUALITY === 'low') Object.assign(JELLY, { opacity: 1, transmission: 0, clearcoat: 0 });
const metal = (c, transparent = QUALITY === 'high') => new THREE.MeshPhysicalMaterial({
  color: c, metalness: 0, ...JELLY, transparent,
  envMapIntensity: ENV_INTENSITY, side: THREE.DoubleSide
});
const BASE_H = 1.1, BOWL_Y = 1.28, SP_Y = 1.42;

// 幾何工具：合併頂點後重算法線 → 低面數但光影平滑、呈現圓潤倒角
function smoothGeo(geo) {
  geo.deleteAttribute('uv');
  geo.deleteAttribute('normal');
  const g = mergeVertices(geo, 1e-4);
  g.computeVertexNormals();
  return g;
}
// 剖面先以平滑曲線取樣再繞中心旋轉；圓周分段足夠，輪廓才會是正圓
function latheGeo(pts, seg, samples) {
  const curve = new THREE.SplineCurve(pts.map(([x, y]) => new THREE.Vector2(x, y)));
  return smoothGeo(new THREE.LatheGeometry(curve.getPoints(samples), seg));
}

const spinMat = metal(0xffecc2);
const knobMat = metal(0xffecc2);

// --- 底座與內部馬達：圓角方塊 ---
const baseMat = metal(0xc3d2ee, true); // 底座保持透明材質，點選馬達時才能直接變半透明而不需重新編譯著色器
const base = new THREE.Mesh(smoothGeo(new RoundedBoxGeometry(3.6, BASE_H, 3.6, 2, 0.28)), baseMat);
base.position.y = BASE_H / 2;
const bevel = new THREE.Mesh(smoothGeo(new RoundedBoxGeometry(3.3, 0.22, 3.3, 2, 0.1)), baseMat);

function resize() {
  const r = stageEl.getBoundingClientRect();
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  const dpr = Math.min(window.devicePixelRatio, MAX_DPR);
  renderer.setPixelRatio(dpr);
  renderer.setSize(W, H);
  if (composer) { composer.setPixelRatio(dpr); composer.setSize(W, H); }
  camera.aspect = W / H;
  applyViewOffset();
  trailCv.width = W * dpr; trailCv.height = H * dpr;
  trailCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!controls.enabled) goView(camView, 0);
}

function applyViewOffset() {

  camera.updateProjectionMatrix();
}

/* ============================================================
   聲音：以 Web Audio 合成糖粒落下的沙沙聲
   ============================================================ */
let actx = null;
function audio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) { actx = null; }
  return actx;
}
let soundOn = true, humG = null, whirrO = null, whirrG = null;
function ensureLoops() {
  const a = audio();
  if (!a || humG) return;
  const hum = a.createOscillator(); hum.type = 'sawtooth'; hum.frequency.value = 55;
  const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 240;
  humG = a.createGain(); humG.gain.value = 0;
  hum.connect(lp).connect(humG).connect(a.destination); hum.start();
  whirrO = a.createOscillator(); whirrO.type = 'triangle'; whirrO.frequency.value = 110;
  whirrG = a.createGain(); whirrG.gain.value = 0;
  whirrO.connect(whirrG).connect(a.destination); whirrO.start();
}
function chime(f = 880, d = 0.6, v = 0.12) {
  if (!soundOn || !actx) return;
  const a = actx, o = a.createOscillator(), g = a.createGain();
  o.type = 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(v, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + d);
  o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + d);
}
const sparkle = () => [1047, 1319, 1568, 2093].forEach((f, i) => setTimeout(() => chime(f, 0.6, 0.08), i * 90));
function updateLoops() {
  if (!actx || !humG) return;
  const now = actx.currentTime;
  humG.gain.setTargetAtTime(soundOn && S.state === 'S3a' && S.holding ? 0.07 : 0, now, 0.08);
  whirrG.gain.setTargetAtTime(soundOn ? S.level * 0.045 : 0, now, 0.1);
  whirrO.frequency.setTargetAtTime(110 + S.level * 480, now, 0.1);
}
function playSand(dur = 1.5) {
  if (!soundOn) return;
  const a = audio();
  if (!a) return;
  const len = Math.floor(a.sampleRate * dur);
  const buf = a.createBuffer(1, len, a.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) {
    const t = i / len;
    const env = Math.min(1, t * 10) * Math.min(1, (1 - t) * 3);
    const grain = Math.random() < 0.06 ? (Math.random() * 2 - 1) : (Math.random() * 2 - 1) * 0.12;
    d[i] = grain * env;
  }
  const src = a.createBufferSource();
  src.buffer = buf;
  const bp = a.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = 4800; bp.Q.value = 0.9;
  const g = a.createGain();
  g.gain.value = 0.9;
  src.connect(bp).connect(g).connect(a.destination);
  src.start();
}

function applyHeat(h) {
  if (sugar.visible) {
    placeHeap(h);
    sugarMat.opacity = 1 - 0.75 * smooth(0.1, 1, h);
    if (h >= 0.999) sugar.visible = false;
  }
  const ls = smooth(0.2, 1, h);
  liquid.visible = h > 0.05;
  liquid.scale.y = 0.01 + 0.12 * ls;
  liquid.position.y = 0.15 + liquid.scale.y / 2;
  liquidMat.opacity = 0.85 * smooth(0.1, 0.7, h);
  holeMat.color.copy(HOLE_COLOR).lerp(HEAT_COLOR, 0.85 * h);
  heatLight.intensity = 1.6 * h;
}
function applyThreads() {
  for (let k = 0; k < THREAD_N; k++) {
    const f = clamp(S.threadP * 1.4 - (k / THREAD_N) * 0.4, 0, 1);
    threads[k].geometry.setDrawRange(0, Math.floor(f * TP));
  }
  threadMat.opacity = 0.85 * S.threadFade;
  ringMat.opacity = 0.6 * smooth(0.3, 1, S.threadP) * S.threadFade;
}
function applyCandy() {
  if (C.prog <= 0) { candyMesh.visible = false; return; }
  candyMesh.visible = true;
  const s = 0.1 + 0.52 * C.prog, f = C.flat, k = C.skew, d = C.dir;
  candyMesh.scale.set(s * (1 + 0.38 * f), s * (1 - 0.42 * f), s * (1 + 0.38 * f));
  candyMesh.position.set(Math.cos(d) * 0.42 * s * k, -0.1 * f * s, Math.sin(d) * 0.42 * s * k);
  candyMesh.rotation.set(Math.sin(d) * 0.4 * k, 0, -Math.cos(d) * 0.4 * k);
}
function resetCandy() {
  Object.assign(C, { prog: 0, acc: 0, flat: 0, skew: 0, dir: 0, flatT: 0, skewT: 0, samples: [], shape: null });
  candyGroup.rotation.set(0, 0, 0);
  applyCandy();
}
function finalizeShape() {
  C.shape = C.skew > 0.5 ? '偏斜' : C.flat > 0.5 ? '扁平' : '圓潤';
  C.flatT = C.shape === '扁平' ? 1 : C.shape === '偏斜' ? 0.15 : 0;
  C.skewT = C.shape === '偏斜' ? 1 : 0;
  C.prog = 1;
}

// 依倒糖順序上色：砂糖顆粒、糖液、糖絲、槽壁糖霧、棉花糖（由下而上分層）
function applySugarColors() {
  const c = new THREE.Color();
  S.pours.forEach((k, b) => { c.setHex(SUGAR_HEX[k]); for (let i = b * BATCH; i < (b + 1) * BATCH; i++) sugar.setColorAt(i, c); });
  if (sugar.instanceColor) sugar.instanceColor.needsUpdate = true;
}
function applyPourColors() {
  const cols = (S.pours.length ? S.pours : [null]).map(k => (k ? new THREE.Color(SUGAR_HEX[k]) : WHITE.clone()));
  const n = cols.length, avg = new THREE.Color(0, 0, 0);
  cols.forEach(c => avg.add(c));
  avg.multiplyScalar(1 / n);
  liquidMat.color.copy(avg).lerp(WHITE, 0.45);
  ringMat.color.copy(avg).lerp(WHITE, 0.3);
  dropMat.color.copy(avg).lerp(WHITE, 0.3);
  candyMat.sheenColor.copy(avg).lerp(WHITE, 0.6); // 絨光取各色的淡色平均
  threads.forEach((ln, k) => {
    const c = cols[k % n].clone().lerp(WHITE, 0.2), a = ln.geometry.attributes.color;
    for (let j = 0; j < a.count; j++) a.setXYZ(j, c.r, c.g, c.b);
    a.needsUpdate = true;
  });
  const pos = candyGeo.attributes.position, col = candyGeo.attributes.color, v = new V3(), c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const t = clamp((v.y + 1.15) / 2.3 + 0.1 * Math.sin(Math.atan2(v.z, v.x) * 3 + v.y * 2), 0, 0.9999);
    const f = t * n, idx = Math.floor(f), fr = f - idx;
    c.copy(cols[idx]);
    if (fr > 0.75 && idx + 1 < n) c.lerp(cols[idx + 1], (fr - 0.75) / 0.25 * 0.5);
    if (fr < 0.25 && idx > 0) c.lerp(cols[idx - 1], (0.25 - fr) / 0.25 * 0.5);
    col.setXYZ(i, c.r, c.g, c.b);
  }
  col.needsUpdate = true;
}
function tintSpoon() {
  const el = document.getElementById('spoonSugar');
  if (el) el.setAttribute('fill', SUGAR_CSS[S.sugarPick] || '#ffffff');
}

function setupStage(n) {
  applyPourColors();
  clearHighlights();
  setBaseSeeThrough(false);
  pour = null; lift = null;

  applyHeat(S.heat);
  S.threadP = n >= 5 ? 1 : 0;
  S.threadFade = n >= 6 ? 0.2 : 1;
  S.level = n === 5 ? 0.8 : 0;
  S.sustain = 0;
  applyThreads();
  drops.forEach(d => { d.m.visible = false; });
  if (n < 5) candyGroup.visible = false;
  if (n === 5) { candyGroup.visible = false; resetCandy(); candyGroup.position.set(0, 0, 0); }
  if (n === 6) {
    if (!C.shape) { C.prog = 1; finalizeShape(); }
    C.flat = C.flatT; C.skew = C.skewT;

function startPour() {

  applySugarColors();

}

  for (let i = pour.b * BATCH; i < (pour.b + 1) * BATCH; i++) {
    const tt = pour.t - (i - pour.b * BATCH) * 0.011;
    if (tt < 0) { setSugar(i, starts[i], 0); continue; }
    const f = Math.min(1, tt / 0.5);
    const p = starts[i].clone().lerp(heap[i], f);
    p.y = starts[i].y + (heap[i].y - starts[i].y) * f * f;
    setSugar(i, p, 1);
  }
  sugar.instanceMatrix.needsUpdate = true;

let liveText = '';
function setLive(t) {
  if (t === liveText) return;
  liveText = t;
  const el = $('#live');

}
function update(dt) {
  stateTime += dt;
  const st = S.state;

  // 攝影機轉場

    camTween.t += dt;
    const k = ease(Math.min(1, camTween.t / camTween.dur));
    camera.position.lerpVectors(camTween.p0, camTween.p1, k);

      else if (!S.seen.has(k)) setEmissive(k, 0xffa64d, reduceMotion ? 0.2 : 0.16 + 0.12 * Math.sin(T * 3));

  }

    else if (moving) S.level += (clamp(G.omega / (TAU * 0.9), 0, 1) - S.level) * Math.min(1, dt * 5);
    else S.level = Math.max(0, S.level - 0.45 * dt);

    else if (S.hint1) setLive('跟著示範畫大圈，連續轉動。');

    if (stateTime > 15 && !S.hint1 && S.sustain === 0) { S.hint1 = true; startGhost('spin'); }
    if (stateTime > 30 && !S.helpOffered) { S.helpOffered = true; renderPanel(); liveText = ''; }

  }

    }

    }

    if (C.samples.length > 8) {

      const cx = sx / n, cz = sz / n, meanR = sr / n, offset = Math.hypot(cx, cz) / 1.2;
      C.flatT = smooth(0.82, 1.05, meanR);
      C.skewT = smooth(0.2, 0.4, offset);
      if (offset > 0.1) C.dir = Math.atan2(cz, cx);
    }
    C.flat += (C.flatT - C.flat) * Math.min(1, dt * 2);
    C.skew += (C.skewT - C.skew) * Math.min(1, dt * 2);
    applyCandy();
    S.threadFade = 1 - 0.75 * C.prog;
    applyThreads();
    const sz = $('#size');
    if (sz) sz.style.width = `${C.prog * 100}%`;
    if (stateTime > 18 && C.prog < 0.25 && !S.hint1) { S.hint1 = true; startGhost('circle'); setLive('按住木棒，在盆子裡一圈一圈地繞。'); }
    if (stateTime > 32 && C.prog < 0.6 && !S.helpOffered) { S.helpOffered = true; liveText = ''; renderPanel(); }
    if (C.prog >= 1 && !S.auto) { S.autoCircle = false; G.active = false; sparkle(); renderPanel('keep'); autoNext('S5c'); }
  }

  // 完成後：形狀定案、木棒抬起、緩慢展示
  if (st === 'S5c' || stageOf(st) === 6) {
    C.flat += (C.flatT - C.flat) * Math.min(1, dt * 3);
    C.skew += (C.skewT - C.skew) * Math.min(1, dt * 3);
    applyCandy();
    if (!reduceMotion) candyGroup.rotation.y += 0.3 * dt;
    if (st === 'S5c' && S.threadFade > 0.2) { S.threadFade = Math.max(0.2, S.threadFade - dt); applyThreads(); }
  }
  if (lift) {
    lift.t += dt;
    const k = ease(Math.min(1, lift.t / 1.1));
    candyGroup.position.lerpVectors(lift.from, lift.to, k);
    if (k >= 1) lift = null;
  }

  // 加熱頭自轉、糖絲隨轉動流動
  spinner.rotation.y += S.level * 24 * dt;
  threadGroup.rotation.y += S.level * 1.2 * dt;

  // 糖液滴落
  for (const d of drops) {
    if (!d.m.visible) continue;
    d.life += dt;
    if (d.m.position.y > 1.46) {
      d.v.y -= 4.9 * dt;
      d.m.position.addScaledVector(d.v, dt);
    }
    if (d.life > 1.2) d.m.visible = false;
  }

  drawGuide();
  drawTrail();
}

// 動畫迴圈：以 Clock 的 delta 讓速度與螢幕更新率無關
/* ============================================================
   環境光遮蔽（GTAO）：零件交界與折角自然變暗，強度 0.35；平板輕量版不開
   ============================================================ */
function setAO(on) {
  useAO = on && !!composer;
  // 後製會對背景也做色調映射，提高背景亮度讓有無遮蔽時底色一致
  scene.backgroundIntensity = useAO ? 1.45 : 1;
}
if (QUALITY === 'high') {
  const dpr0 = Math.min(window.devicePixelRatio, MAX_DPR);
  composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(W * dpr0, H * dpr0, { type: THREE.HalfFloatType, samples: 4 }));
  composer.addPass(new RenderPass(scene, camera));
  const gtao = new GTAOPass(scene, camera, W, H);
  gtao.updateGtaoMaterial({ radius: 0.4, distanceExponent: 2, thickness: 1, scale: 0.85, samples: 16 });
  gtao.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 6, rings: 2, samples: 16 });
  gtao.blendIntensity = 0.35;
  // 計算遮蔽時暫時隱藏防風玻璃與導引糖絲，避免透明物件被當成遮擋物
  const gtaoRender = gtao.render.bind(gtao);
  gtao.render = (...args) => {
    const sv = shield.visible, tv = threadGroup.visible;
    shield.visible = false; threadGroup.visible = false;
    gtaoRender(...args);
    shield.visible = sv; threadGroup.visible = tv;
  };
  composer.addPass(gtao);
  composer.addPass(new OutputPass());
  composer.setPixelRatio(dpr0);
  composer.setSize(W, H);
  setAO(true);
}

// 幀率監測：第一個 3 秒視窗用來暖機（著色器編譯），之後若低於 40fps，先降解析度、再降材質
const perf = { start: 0, frames: 0, warmed: false, done: false };
function watchPerf(now) {
  if (perf.done) return;
  if (document.hidden) { perf.start = 0; return; }
  if (!perf.start) { perf.start = now; perf.frames = 0; return; }
  perf.frames++;
  const elapsed = now - perf.start;
  if (elapsed < 3000) return;
  const fps = (perf.frames * 1000) / elapsed;
  perf.start = 0;
  if (!perf.warmed) { perf.warmed = true; return; }
  if (fps >= 40) { perf.done = true; return; }
  if (useAO) { setAO(false); return; }            // 第一步：先關環境光遮蔽
  if (MAX_DPR > 1) { MAX_DPR = 1; resize(); return; } // 第二步：降解析度
  if (QUALITY === 'high') degradeMaterials();
  perf.done = true;
}

// 拍立得：用另一台相機從棉花糖視角拍一張，裁成正方形
const snapCam = camera.clone();
function snapCandy() {
  const v = CAM.candy, k = camera.aspect < 1.1 ? Math.pow(1.1 / camera.aspect, 0.8) : 1;
  snapCam.copy(camera);
  snapCam.clearViewOffset();
  snapCam.position.copy(v.target.clone().add(v.pos.clone().sub(v.target).multiplyScalar(k * 0.92)));
  snapCam.lookAt(v.target);
  snapCam.updateProjectionMatrix();
  renderer.render(scene, snapCam);
  const src = renderer.domElement, side = Math.min(src.width, src.height);
  const out = document.createElement('canvas'); out.width = out.height = Math.min(720, side);
  out.getContext('2d').drawImage(src, (src.width - side) / 2, (src.height - side) / 2, side, side, 0, 0, out.width, out.height);
  return out.toDataURL('image/jpeg', 0.9);
}
function printPolaroid() {
  const box = $('#polaroid');
  box.hidden = true;
  $('#poloImg').src = snapCandy();
  $('#poloText').textContent = myPara() || '我的棉花糖';
  const d = new Date();
  $('#poloDate').textContent = `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
  // 重新觸發動畫
  const card = box.querySelector('.polo-card'), img = $('#poloImg'), acts = box.querySelector('.polo-actions');
  [card, img, acts].forEach(el => { el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; });
  box.hidden = false;
}
// 長按拍立得：把相片和描寫畫成一張圖下載
function wrapText(ctx, text, maxW) {
  const lines = []; let line = '';
  for (const ch of text) { if (ctx.measureText(line + ch).width > maxW && line) { lines.push(line); line = ch; } else line += ch; }
  if (line) lines.push(line);
  return lines;
}
async function polaroidBlob() {
  const img = $('#poloImg');
  if (!img.complete) await new Promise(r => { img.onload = r; });
  const W = 900, pad = 44, photo = W - pad * 2, font = '"Chiron GoRound TC", sans-serif';
  const meas = document.createElement('canvas').getContext('2d');
  meas.font = `36px ${font}`;
  const lines = wrapText(meas, $('#poloText').textContent, photo - 8);
  const H = pad + photo + 40 + lines.length * 62 + 70;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#FFFDF9'; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(img, pad, pad, photo, photo);
  ctx.fillStyle = '#3A3150'; ctx.font = `36px ${font}`; ctx.textBaseline = 'top';
  lines.forEach((l, i) => ctx.fillText(l, pad + 4, pad + photo + 36 + i * 62));
  ctx.fillStyle = '#A79DB8'; ctx.font = '26px Fredoka, sans-serif'; ctx.textAlign = 'right';
  ctx.fillText($('#poloDate').textContent, W - pad, H - 56);
  return new Promise(r => c.toBlob(r, 'image/png'));
}
let dlCap;
async function downloadPolaroid() {
  const blob = await polaroidBlob();
  const filename = '我的棉花糖.png';
  try {
    if (dlCap === undefined) dlCap = window.claude?.use ? await window.claude.use('downloads') : null;
    if (dlCap) { await dlCap.save({ filename, data: blob }); toast('拍立得已下載'); return; }
  } catch (err) {
    if (err && err.code === 'declined') return;
    if (err && err.code === 'rate_limited') { toast('稍等一下再試試看'); return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
{
  const card = document.querySelector('.polo-card');
  let timer = null;
  const cancel = () => { clearTimeout(timer); timer = null; card.classList.remove('pressing'); };
  card.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    card.classList.add('pressing');
    timer = setTimeout(() => { cancel(); downloadPolaroid(); }, 650);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => card.addEventListener(t, cancel));
  card.addEventListener('contextmenu', e => e.preventDefault());
}
$('#poloDone').addEventListener('click', () => { $('#polaroid').hidden = true; });
$('#polaroid').addEventListener('click', e => { if (e.target.id === 'polaroid') $('#polaroid').hidden = true; });
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#polaroid').hidden = true; });

const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  watchPerf(performance.now());
  const dt = Math.min(clock.getDelta(), 0.1);
  T += dt;
  update(dt);
  controls.update();
  if (useAO) composer.render(dt);
  else renderer.render(scene, camera);
}

resize();
setupStage(0);
enter('S0');
goView('overview', 0);
loop();
// 在開始操作前預先編譯倒糖材質，避免首次放開勺子時才等待 shader。
// 直接編譯隱藏物件，不改變可見狀態，也不等待編譯完成才啟動互動。
requestAnimationFrame(() => {
  Promise.all([
    renderer.compileAsync(spoon3d, camera, scene),
    renderer.compileAsync(sugar, camera, scene)
  ]).catch(err => console.warn('倒糖材質預備未完成，將於顯示時編譯。', err));
});
